name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: |
          xcodebuild test \
            -project Viadrouniki.xcodeproj \
            -scheme Viadrouniki \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Mint
        run: brew install mint

      - name: Lint with SwiftFormat
        run: mint run swiftformat --lint .
