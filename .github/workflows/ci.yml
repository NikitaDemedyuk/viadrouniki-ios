name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project Viadrouniki.xcodeproj

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run tests
        run: |
          xcodebuild test \
            -project Viadrouniki.xcodeproj \
            -scheme Viadrouniki \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Mint
        run: brew install mint

      - name: Lint with SwiftFormat
        run: mint run swiftformat --lint .
